          pop();

          pop();

          // 頭（沒有頭頂紅點、沒有兩根天線），頭底貼著媽媽的背、微微上下呼吸
          push();
          translate(BABY_OFFSET_X + 42 * s, babyY, 9.04 + headH / 2 + breathePhase);
          fill(184, 188, 194);
          stroke(45, 48, 54);
          strokeWeight(0.5);
          box(28 * s, 30 * s, headH);
          pop();
        }
      }

      renderXYGroundSweepingLimb(mountX, mountY, side, phase, amplitude, col, isHind = false) {
        push();
        translate(mountX, mountY, 0);

        let sweepAngle = 0;
        if (this.isGliding && isHind) {
          // 後腳往後收：向後旋轉 90 度緊貼尾巴兩側，與軀幹形成 T 字縱軸！
          let tuckAngle = HALF_PI * side;
          if (this.state === 'GLIDE_LANDED') {
            // 著陸收勢緩衝：由 T 姿平滑恢復至地面行走四肢朝向
            let tLand = 1 - constrain(this.landTimer / 35, 0, 1);
            tuckAngle = lerp(HALF_PI * side, 0, tLand);
          }
          rotateZ(tuckAngle);
        } else if (this.isGliding && !isHind) {
          // 前肢向兩側張開成 T 字橫樑 (翼展)，微幅氣流抖動
          let flutter = sin(frameCount * 0.2) * 0.03;
          rotateZ(flutter * side);
        } else if (this.isMoving && (this.speed > 0.05 || this.isTurning)) {
          sweepAngle = sin(phase) * amplitude;
          rotateZ(sweepAngle);
        }

        // 貼牆壓掌：四肢繞自身長軸翻轉，把掌面轉正壓平貼上牆面 (貼牆時為 0、翻正過程最大)
        if (!this.isGliding && Math.abs(this.limbPress) > 0.001) {
          rotateY(this.limbPress);
        }

        // 牆頂起跳：前肢往牆面（腹部側）撐出；後腳在收勢時往後收成滑翔 T 字姿
        if (this.state === 'WALL_TOP_LAUNCH') {
          if (!isHind && this.launchLegPush > 0.001) {
            rotateX(-this.launchLegPush * 0.5 * side);
          }
          if (isHind && this.launchLegBlend > 0.001) {
            rotateZ(HALF_PI * side * this.launchLegBlend);
          }
        }

        let limbW = 12;
        let limbL = 25;
        let limbH = 6;

        translate(0, (limbL / 2) * side, 0);
        fill(col);
        box(limbW, limbL, limbH);
        pop();
      }

      renderFrontMembrane(mountX, mountY, side, phase, amplitude) {
        // 前腳擺動角 (滑翔時保持張開成 T 字翼展)
        let sweepAngle = 0;
        if (this.isGliding) {
          sweepAngle = sin(frameCount * 0.2) * 0.03 * side;
        } else if (this.isMoving && (this.speed > 0.05 || this.isTurning)) {
          sweepAngle = sin(phase) * amplitude;
        }
        let cosS = cos(sweepAngle);
        let sinS = sin(sweepAngle);

        // 1. 前腳內側附著點 (隨前腳掃動自然轉動)
        let legAttachDist = 18;
        let legX = mountX + (-6 * cosS - (legAttachDist * side) * sinS);
        let legY = mountY + (-6 * sinS + (legAttachDist * side) * cosS);

        // 牆頂起跳：前肢往牆面撐出時，薄膜腳端同步往腹部側擺，保持與前肢相連
        let legZ = 0;
        if (this.state === 'WALL_TOP_LAUNCH' && this.launchLegPush > 0.001) {
          const pushA = this.launchLegPush * 0.5;
          legY = mountY + (legY - mountY) * cos(pushA);
          legZ = -legAttachDist * sin(pushA);
        }

        // 2. 軀幹側邊附著點 (牢牢錨定在軀幹外壁，不隨腳旋轉而縮進體內或脫離)
        let trunkY = mountY + (!this.isMoving && !this.isGliding ? sin(this.breathePhase) * 0.3 * side : 0);
        let trunkX = -8;

        // 3. 腋下關節附著點 (前腳根部與軀幹相接處)
        let jointX = 12;
        let jointY = trunkY;

        push();
        noStroke();
        fill(170, 175, 185, 210);

        // 位於 Z = 0 (肢體厚度中心)，遠離地板 Z = -3，徹底根除 Z-fighting 閃爍與穿地消失
        const memZ = 0.15;

        // 雙面繪製以確保在任意 3D 視角與光照下皆穩定清晰可見、永不閃爍或消失
        // 貼牆壓掌：薄膜與前肢同步，繞前肢根部 (mountX, mountY) 繞 Y 軸轉正貼上牆面
        const pressA = (!this.isGliding) ? this.limbPress : 0;
        const cosA = cos(pressA);
        const sinA = sin(pressA);
        const rollMemX = (x, z) => mountX + (x - mountX) * cosA + z * sinA;
        const rollMemZ = (x, z) => -(x - mountX) * sinA + z * cosA;

        // 薄膜腳端：只套用貼牆翻正 (roll)，其餘維持與前肢相連
        const legPoint = (zSign) => {
          const px = rollMemX(legX, zSign * memZ);
          const pz = rollMemZ(legX, zSign * memZ) + legZ;
          return [px, legY, pz];
        };
        const lp1 = legPoint(1);
        const lp2 = legPoint(-1);

        beginShape();
        vertex(rollMemX(jointX, memZ), jointY, rollMemZ(jointX, memZ));
        vertex(lp1[0], lp1[1], lp1[2]);
        vertex(rollMemX(trunkX, memZ), trunkY, rollMemZ(trunkX, memZ));
        endShape(CLOSE);

        beginShape();
        vertex(rollMemX(jointX, -memZ), jointY, rollMemZ(jointX, -memZ));
        vertex(rollMemX(trunkX, -memZ), trunkY, rollMemZ(trunkX, -memZ));
        vertex(lp2[0], lp2[1], lp2[2]);
        endShape(CLOSE);

        pop();
      }
    }

    function toggleMove() {
      autoMoveEnabled = !autoMoveEnabled;
      const btn = document.getElementById('btn-run');
      if (autoMoveEnabled) {
        btn.textContent = '漫遊開關：開';
        btn.classList.remove('active');
      } else {
        btn.textContent = '漫遊開關：停';
        btn.classList.add('active');
      }
    }

    function triggerNextMoveNow() {
      creature.startNewMove();
    }

    // 雌雄切換：雄性 = 目前外觀；雌性 = 背上多一個小口袋 + 尾端三個長方形縮小成 2/3
    function setGender(g) {
      creatureGender = g;
      if (g !== 'female') carryBaby = false;   // 只有雌性會帶孩子
      const btn = document.getElementById('btn-sex');
      if (g === 'female') {
        btn.textContent = '性別：雌性';
        btn.classList.add('female');
      } else {
        btn.textContent = '性別：雄性';
        btn.classList.remove('female');
      }
      updateBabyButton();
    }

    function toggleGender() {
      setGender(creatureGender === 'male' ? 'female' : 'male');
    }

    // 帶孩子：兩隻孩子 = 縮小版雄性個體，並排塞在雌性背上的口袋裡（沒有紅點與天線）
    // 若目前是雄性，按下去會自動切成雌性再背上孩子
    function toggleCarryBaby() {
      if (creatureGender !== 'female') setGender('female');
      carryBaby = !carryBaby;
      updateBabyButton();
    }

    function updateBabyButton() {
      const btn = document.getElementById('btn-baby');
      if (carryBaby) {
        btn.textContent = '帶孩子：開';
        btn.classList.add('on');
      } else {
        btn.textContent = '帶孩子：關';
        btn.classList.remove('on');
      }
    }

    // 「立即下水」按鈕：若目前是暫停狀態，先恢復漫遊，再直接前往水池
    function bathNow() {
      if (!autoMoveEnabled) {
        autoMoveEnabled = true;
        const btn = document.getElementById('btn-run');
        btn.textContent = '漫遊開關：開';
        btn.classList.remove('active');
      }
      creature.goBathNow();
    }

    function climbWithChoice(choice) {
      creature.forcedNextAction = choice;
      creature.startClimbWall();
    }

    function updateHUD() {
      const statusEl = document.getElementById('status-text');
      if (!autoMoveEnabled) {
        statusEl.innerHTML = `<span style="color:#ef4444">已手動暫停</span> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
        return;
      }

      if (creature.state === 'APPROACHING_WALL') {
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">貼牆前奏：一邊小幅靠近牆面，一邊把頭抬起來與牆面平行貼齊 🧗‍♂️ (身體仍平貼地面)</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'TRANSITION_TO_WALL') {
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">頭部已貼齊牆面，身體與四肢正以相同節奏轉正貼平牆面、掌面壓上牆 🧗‍♂️ (尾巴先貼地再順勢貼上牆)</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'CLIMBING_UP') {
        statusEl.innerHTML = `狀態：<b style="color:#22c55e">順著右側牆面垂直往上爬中 🧗‍♂️ (全身貼齊牆面，尾部貼地) (高度 Z: ${creature.pos.z.toFixed(0)})</b> | 頂端邊界：${WALL_TOP_LIMIT} | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'WALL_TOP_TURN') {
        statusEl.innerHTML = `狀態：<b style="color:#f59e0b">觸及最頂端邊界！貼著牆面調頭中 🔄 (同步微幅下滑，尾巴不甩出牆外)</b> | 高度 Z: ${creature.pos.z.toFixed(0)} | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'WALL_TOP_PAUSE') {
        statusEl.innerHTML = `狀態：<b style="color:#f59e0b">【選擇二】牆頂蓄力：頭下腳上貼牆停頓 0.5 秒 ⏸️</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'WALL_TOP_LAUNCH') {
        let launchF = creature.launchProgress;
        let launchPhase;
        if (launchF <= LAUNCH_PUSH1_FRAMES) {
          launchPhase = '前肢撐牆，頭胸微微離開牆面（後腳與尾巴仍貼牆）';
        } else if (launchF <= LAUNCH_PUSH1_FRAMES + LAUNCH_PUSH2_FRAMES) {
          launchPhase = '前肢蹬牆，身體翻成水平並往 -Y 方向離開牆面（尾巴與後腳離牆）';
        } else {
          launchPhase = '尾巴最後離牆擺正，四肢張開成滑翔 T 字姿';
        }
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">【選擇二】牆頂起跳：${launchPhase} 🪂</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'CLIMBING_DOWN') {
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">【選擇一】轉頭完畢，順著牆面垂直往下爬回地面 🧗‍♀️ (全身貼齊牆面) (高度 Z: ${creature.pos.z.toFixed(0)})</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'TRANSITION_TO_GROUND') {
        statusEl.innerHTML = `狀態：<b style="color:#a855f7">頭部先彎下貼平地面，身體再以頸部貼地點為支點跟著放平，尾巴最後回到地面 (全程底面貼齊牆面與地板)</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'GLIDING') {
        let glidePct = Math.round((creature.glideProgress / creature.glideTotalFrames) * 100);
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">【選擇二】空中 T 字型薄膜緩慢滑翔中 🪂 (${glidePct}%)</b> | 高度 Z: ${creature.pos.z.toFixed(0)} | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'GLIDE_LANDED') {
        statusEl.innerHTML = `狀態：<b style="color:#22c55e">滑翔著陸！收攏四肢回到地面站立姿態 🛬</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'POOL_SINKING') {
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">身體進入水面，慢慢沉進水裡、頭抬 30 度 🏊 (${Math.round(creature.sinkAmount * 100)}%)</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'POOL_SWIMMING') {
        let swimDist = Math.hypot(POOL_X - creature.pos.x, POOL_Y - creature.pos.y).toFixed(0);
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">沉在水裡，頭抬 30 度游向水池正中央 🐊 (距池心 ${swimDist})</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'POOL_SOAK') {
        let soakLeft = Math.max(0, (POOL_SOAK_FRAMES - creature.soakTimer) / 60).toFixed(1);
        statusEl.innerHTML = `狀態：<b style="color:#22c55e">沉在水池正中央休息 🐊 (身體沉浸水裡、頭抬 30 度、輕輕浮動)</b> | 還要停留 <b style="color:#f59e0b">${soakLeft} 秒</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'POOL_RISING' || creature.state === 'POOL_CLIMBING_OUT') {
        const riseText = (creature.state === 'POOL_RISING')
          ? '休息完畢，游回岸邊'
          : '從水面浮起，慢慢爬出水池 💧';
        statusEl.innerHTML = `狀態：<b style="color:#38bdf8">${riseText}</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'WAITING') {
        let secRemaining = (creature.waitTimer / 60).toFixed(1);
        statusEl.innerHTML = `狀態：<b style="color:#94a3b8">原地停頓休息中 (微幅呼吸律動)</b> | 下次移動倒數：<b style="color:#f59e0b">${secRemaining} 秒</b> | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'ALIGNING_TURN') {
        statusEl.innerHTML = `狀態：<b style="color:#a855f7">轉身對齊目標方向中 (手腳划動調頭 🔄)</b> | 目標航向：${(creature.targetHeading * 180 / PI).toFixed(0)}° | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else if (creature.state === 'WALL_TURNING') {
        statusEl.innerHTML = `狀態：<b style="color:#f59e0b">碰壁原地轉向中 (四肢踏步轉身 🔄)</b> | 目標角：${(creature.targetHeading * 180 / PI).toFixed(0)}° | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      } else {
        let speedPhase = '巡航中';
        let progress = creature.moveCurrentFrame / creature.moveTotalFrames;
        if (progress < 0.15) speedPhase = '起步加速中';
        else if (progress > 0.60) speedPhase = '<span style="color:#f59e0b">平滑減速緩衝中...</span>';

        statusEl.innerHTML = `模式：<b style="color:#38bdf8">${creature.currentModeName}</b> (${speedPhase}) | 座標：[X:${creature.pos.x.toFixed(0)}, Y:${creature.pos.y.toFixed(0)}, Z:${creature.pos.z.toFixed(0)}]`;
      }
    }
  </script>
</body>
</html>
